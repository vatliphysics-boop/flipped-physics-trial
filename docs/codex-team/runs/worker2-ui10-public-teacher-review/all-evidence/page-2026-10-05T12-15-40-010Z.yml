                    - textbox "Tổ chức thực hiện — Báo cáo và thảo luận" [ref=f17e601]: Giáo viên chọn sản phẩm để trao đổi; học sinh trình bày căn cứ, so sánh kết quả và phản hồi cho bạn. Nhiệm vụ ngoài lớp được thảo luận ở thời điểm do giáo viên bố trí.
