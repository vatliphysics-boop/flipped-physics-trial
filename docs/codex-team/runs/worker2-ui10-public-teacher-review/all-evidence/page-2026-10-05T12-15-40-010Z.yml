                    - textbox "Tổ chức thực hiện — Thực hiện nhiệm vụ" [ref=f17e599]: "Học sinh thực hiện nhiệm vụ với học liệu đã gắn, ghi kết quả và điều chưa hiểu. Giáo viên theo dõi, hỗ trợ: Cung cấp bảng ba cột Z–N–A cho học sinh cần hỗ trợ; nhóm hoàn thành sớm so sánh tỉ số bán kính theo A^(1/3)."
