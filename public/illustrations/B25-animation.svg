<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Ước lượng chu kì bán rã từ số liệu</title><desc id="desc">Theo SGK Vật lí 12 Kết nối tri thức, Bảng 25.1, trang in 121 Chấm xanh là số liệu SGK. Đoạn nối màu vàng dùng để nội suy; 39,5 giây là giá trị ước lượng.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f6fb"/><stop offset="1" stop-color="#e4eef7"/></linearGradient></defs><style>@media(prefers-reduced-motion:reduce){.motion-guide{display:none}}</style><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="700" rx="24" fill="url(#bg)" stroke="none"/><rect x="36" y="34" width="76" height="36" rx="9" fill="#172f4d" stroke="none"/><text x="74" y="60" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">B25</text><text x="132" y="62" font-size="34" fill="#172f4d" font-weight="700" text-anchor="start">Ước lượng chu kì bán rã từ số liệu</text><text x="40" y="103" font-size="19" fill="#506980" font-weight="400" text-anchor="start">Theo SGK Vật lí 12 Kết nối tri thức, Bảng 25.1, trang in 121</text><rect x="35" y="140" width="285" height="455" rx="18" fill="#fff" stroke="none"/><rect x="340" y="140" width="545" height="455" rx="18" fill="#fff" stroke="none"/><rect x="905" y="140" width="260" height="455" rx="18" fill="#fff" stroke="none"/><text x="64" y="192" font-size="24" fill="#172f4d" font-weight="700" text-anchor="start">Bảng 25.1</text><text x="70" y="233" font-size="19" fill="#506980" font-weight="400" text-anchor="start">t (s)</text><text x="271" y="233" font-size="19" fill="#506980" font-weight="400" text-anchor="end">H (Bq)</text><rect x="55" y="242" width="245" height="30" rx="6" fill="#eef4f9" stroke="none"/><text x="71" y="264" font-size="18" fill="#172f4d" font-weight="400" text-anchor="start">0</text><text x="271" y="264" font-size="20" fill="#172f4d" font-weight="700" text-anchor="end">151</text><rect x="55" y="279" width="245" height="30" rx="6" fill="#eef4f9" stroke="none"/><text x="71" y="301" font-size="18" fill="#172f4d" font-weight="400" text-anchor="start">30</text><text x="271" y="301" font-size="20" fill="#172f4d" font-weight="700" text-anchor="end">85</text><rect x="55" y="316" width="245" height="30" rx="6" fill="#eef4f9" stroke="none"/><text x="71" y="338" font-size="18" fill="#172f4d" font-weight="400" text-anchor="start">60</text><text x="271" y="338" font-size="20" fill="#172f4d" font-weight="700" text-anchor="end">55</text><rect x="55" y="353" width="245" height="30" rx="6" fill="#eef4f9" stroke="none"/><text x="71" y="375" font-size="18" fill="#172f4d" font-weight="400" text-anchor="start">120</text><text x="271" y="375" font-size="20" fill="#172f4d" font-weight="700" text-anchor="end">31</text><rect x="55" y="390" width="245" height="30" rx="6" fill="#eef4f9" stroke="none"/><text x="71" y="412" font-size="18" fill="#172f4d" font-weight="400" text-anchor="start">180</text><text x="271" y="412" font-size="20" fill="#172f4d" font-weight="700" text-anchor="end">22</text><rect x="55" y="427" width="245" height="30" rx="6" fill="#eef4f9" stroke="none"/><text x="71" y="449" font-size="18" fill="#172f4d" font-weight="400" text-anchor="start">240</text><text x="271" y="449" font-size="20" fill="#172f4d" font-weight="700" text-anchor="end">15</text><rect x="55" y="464" width="245" height="30" rx="6" fill="#eef4f9" stroke="none"/><text x="71" y="486" font-size="18" fill="#172f4d" font-weight="400" text-anchor="start">300</text><text x="271" y="486" font-size="20" fill="#172f4d" font-weight="700" text-anchor="end">11</text><rect x="55" y="501" width="245" height="30" rx="6" fill="#eef4f9" stroke="none"/><text x="71" y="523" font-size="18" fill="#172f4d" font-weight="400" text-anchor="start">360</text><text x