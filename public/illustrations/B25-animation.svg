147e7b" opacity="1"/><circle cx="438.0" cy="386.625" r="6" fill="#147e7b" opacity="1"/><circle cx="474.0" cy="436.875" r="6" fill="#147e7b" opacity="1"/><circle cx="546.0" cy="477.075" r="6" fill="#147e7b" opacity="1"/><circle cx="618.0" cy="492.15" r="6" fill="#147e7b" opacity="1"/><circle cx="690.0" cy="503.875" r="6" fill="#147e7b" opacity="1"/><circle cx="762.0" cy="510.575" r="6" fill="#147e7b" opacity="1"/><circle cx="834.0" cy="513.925" r="6" fill="#147e7b" opacity="1"/><path d="M 402 402.5375 H 449.4 V 529" stroke="#9d6a11" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="8 8"/><text x="510" y="392.5375" font-size="17" fill="#8b5c10" font-weight="700" text-anchor="start">75,5 Bq</text><polyline points="438.0,386.625 474.0,436.875" stroke="#9d6a11" fill="none" stroke-width="3"/><text x="930" y="202" font-size="23" fill="#172f4d" font-weight="700" text-anchor="start">Mức nửa hoạt độ</text><text x="925" y="267" font-size="22" fill="#172f4d" font-weight="700" text-anchor="start">H(T) =</text><text x="1010" y="252" font-size="20" fill="#172f4d" font-weight="600" text-anchor="middle">H₀</text><path d="M 992.0 262 H 1028.0" stroke="#172f4d" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="1010" y="285" font-size="20" fill="#172f4d" font-weight="600" text-anchor="middle">2</text><text x="1038" y="267" font-size="20" fill="#172f4d" font-weight="700" text-anchor="start">= 75,5 Bq</text><text x="930" y="343" font-size="23" fill="#172f4d" font-weight="700" text-anchor="start">Công thức liên hệ</text><text x="925" y="413" font-size="20" fill="#172f4d" font-weight="600" text-anchor="start">H(t) = H₀ · 2</text><text x="1031" y="398" font-size="15" fill="#172f4d" font-weight="600" text-anchor="start">−</text><text x="1047" y="388" font-size="14" fill="#172f4d" font-weight="600" text-anchor="middle">t</text><path d="M 1040 392 H 1054" stroke="#172f4d" stroke-width="1" fill="none" stroke-linecap="round"/><text x="1047" y="405" font-size="14" fill="#172f4d" font-weight="600" text-anchor="middle">T</text><text x="925" y="471" font-size="21" fill="#172f4d" font-weight="700" text-anchor="start">λ =</text><text x="992" y="454" font-size="20" fill="#172f4d" font-weight="600" text-anchor="middle">ln 2</text><path d="M 964.0 464 H 1020.0" stroke="#172f4d" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="992" y="487" font-size="20" fill="#172f4d" font-weight="600" text-anchor="middle">T</text><text x="926" y="528" font-size="22" fill="#147e7b" font-weight="700" text-anchor="start">H(t) = λN(t)</text><text x="57" y="634" font-size="23" fill="#172f4d" font-weight="700" text-anchor="start">T nằm giữa 30 và 60 giây. Nội suy thẳng giữa hai điểm cho khoảng 39,5 giây.</text><text x="40" y="670" font-size="16" fill="#506980" font-weight="400" text-anchor="start">Chấm xanh là số liệu SGK. Đoạn nối màu vàng dùng để nội suy; 39,5 giây là giá trị ước lượng.</text><g class="motion-guide"><polyline points="438.0,386.625 474.0,436.875" fill="none" stroke="#d09a37" stroke-width="6" stroke-dasharray="60" stroke-dashoffset="60"><animate attributeName="stroke-dashoffset" values="60;0;0" keyTimes="0;0.8;1" dur="6s" repeatCount="indefinite"/></polyline></g></g></svg>