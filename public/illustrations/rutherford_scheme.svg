<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">B21 Cấu trúc hạt nhân</title><desc id="desc">Nguồn α. Lá vàng mỏng. Màn thu tín hiệu. Hạt nhân nhỏ, mang điện +. A = Z + N · Đồng vị: cùng Z. R ≈ 1,2 A^(1/3) fm. Sơ đồ định tính không theo tỉ lệ.</desc><style>text{font-family:Arial,sans-serif} @media(prefers-reduced-motion:reduce){.moving{display:none}}</style><rect width="1000" height="560" rx="24" fill="#eef4fb"/><text x="42" y="64" font-size="30" font-weight="700" fill="#17375e">B21 · Cấu trúc hạt nhân</text><rect x="42" y="130" width="266" height="105" rx="18" fill="#17375e"/><text x="175" y="190" fill="white" font-size="20" text-anchor="middle">Nguồn α</text><path d="M314 182h40m-10 -9l10 9 -10 9" fill="none" stroke="#385c86" stroke-width="4"/><rect x="367" y="130" width="266" height="105" rx="18" fill="#226997"/><text x="500" y="190" fill="white" font-size="20" text-anchor="middle">Lá vàng mỏng</text><path d="M639 182h40m-10 -9l10 9 -10 9" fill="none" stroke="#385c86" stroke-width="4"/><rect x="692" y="130" width="266" height="105" rx="18" fill="#13786b"/><text x="825" y="190" fill="white" font-size="20" text-anchor="middle">Màn thu tín hiệu</text><text x="42" y="310" font-size="21" fill="#25374e">Hạt nhân nhỏ, mang điện +</text><text x="42" y="374" font-size="21" fill="#25374e">A = Z + N · Đồng vị: cùng Z</text><text x="42" y="438" font-size="21" fill="#25374e">R ≈ 1,2 A^(1/3) fm</text><text x="42" y="527" font-size="16" fill="#4c627c">Học liệu Vật lí 12 · Hình minh họa quy ước · Đối chiếu SGK Chương IV</text></svg>