<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Điện được tạo ra ở đâu?</title><desc id="desc">Sơ đồ nguyên lí lò nước áp lực: theo dòng vật chất và dòng năng lượng Mô hình giản lược một thiết kế lò; không đại diện cho mọi nhà máy. Mũi tên trong bộ trao đổi chỉ dòng nhiệt.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f6fb"/><stop offset="1" stop-color="#e4eef7"/></linearGradient></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="700" rx="24" fill="url(#bg)" stroke="none"/><rect x="36" y="34" width="76" height="36" rx="9" fill="#172f4d" stroke="none"/><text x="74" y="60" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">B24</text><text x="132" y="62" font-size="34" fill="#172f4d" font-weight="700" text-anchor="start">Điện được tạo ra ở đâu?</text><text x="40" y="103" font-size="19" fill="#506980" font-weight="400" text-anchor="start">Sơ đồ nguyên lí lò nước áp lực: theo dòng vật chất và dòng năng lượng</text><rect x="35" y="140" width="1130" height="464" rx="18" fill="#fff" stroke="none"/><rect x="118" y="276" width="124" height="163" rx="24" fill="#dbe7f0" stroke="#172f4d"/><rect x="147" y="307" width="20" height="92" rx="3" fill="#d54f53" stroke="none"/><rect x="187" y="307" width="20" height="92" rx="3" fill="#d54f53" stroke="none"/><path d="M 164 228 L 164 326" stroke="#506980" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M 195 228 L 195 326" stroke="#506980" stroke-width="7" fill="none" stroke-linecap="round"/><text x="175" y="483" font-size="22" fill="#172f4d" font-weight="700" text-anchor="middle">Lò phản ứng</text><text x="175" y="511" font-size="18" fill="#506980" font-weight="400" text-anchor="middle">Phân hạch → nhiệt</text><rect x="468" y="266" width="99" height="176" rx="16" fill="#edf3f7" stroke="#172f4d"/><path d="M 242 318 L 397 318 Q 440 318 484 334 L 493 397 Q 455 424 399 424 L 244 424" stroke="#d54f53" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 277 318 L 333 318" stroke="#d54f53" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><text x="346" y="287" font-size="20" fill="#d54f53" font-weight="700" text-anchor="middle">Vòng sơ cấp</text><path d="M 545 294 L 716 294 L 756 325" stroke="#b98529" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 804 383 L 804 470 L 551 470 L 545 417" stroke="#b98529" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 532 308 L 532 418" stroke="#b98529" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M 499 325 L 524 325" stroke="#147e7b" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 499 368 L 524 368" stroke="#147e7b" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><text x="518" y="511" font-size="22" fill="#172f4d" font-weight="700" text-anchor="middle">Trao đổi nhiệt</text><text x="518" y="538" font-size="17" fill="#506980" font-weight="400" text-anchor="middle">Hai vòng không trộn lẫn</text><rect x="756" y="314" width="96" height="86" rx="9" fill="#e9c77e" stroke="#172f4d"/><path d="M 770 321 L 833 356 L 770 391" stroke="#172f4d" stroke-width="3" fill="none" stroke-linecap="round"/><text x="804" y="266" font-size="22" fill="#172f4d" font-weight="700" text-anchor="middle">Turbine</text><path d="M 852 357 L 930 357" stroke="#172f4d" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="981" cy="357" r="51" fill="#c9e4df" opacity="1"/><text x="981" y="368" font-size="30" fill="#147e7b" font-weight="700" text-anchor="middle">G</text><text x="981" y="266" font-size="22" fill="#172f4d" font-weight="700" text-anchor="middle">Máy phát</text><path d="M 1039 357 L 1111 357" stroke="#147e7b" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1083" y="400" font-size="20" fill="#147e7b" font-weight="700" text-anchor="middle">Điện</text><rect x="762" y="446" width="91" height="40" rx="6" fill="#b9d9ed" stroke="none"/><text x="848" y="552" font-size="19" fill="#506980" font-weight="400" text-anchor="middle">Ngưng tụ</text><path d="M 735 482 L 735 525 L 1033 525 L 1033 482 L 854 482" stroke="#268fbc" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><text x="645" y="243" font-size="19" fill="#9b6a1c" font-weight="400" text-anchor="start">Vòng thứ cấp (hơi / nước)</text><text x="64" y="636" font-size="25" fill="#172f4d" font-weight="700" text-anchor="start">Năng lượng hạt nhân   →   Nhiệt năng   →   Cơ năng   →   Điện năng</text><text x="40" y="670" font-size="16" fill="#506980" font-weight="400" text-anchor="start">Mô hình giản lược một thiết kế lò; không đại diện cho mọi nhà máy. Mũi tên trong bộ trao đổi chỉ dòng nhiệt.</text></g></svg>