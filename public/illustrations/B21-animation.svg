<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Bằng chứng cho một hạt nhân nhỏ</title><desc id="desc">Từ đường đi của hạt α đến cách đọc A, Z, N Sơ đồ định tính, hạt nhân phóng đại; không thể suy ra tỉ lệ kích thước từ hình.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f6fb"/><stop offset="1" stop-color="#e4eef7"/></linearGradient></defs><style>@media(prefers-reduced-motion:reduce){.motion-guide{display:none}}</style><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="700" rx="24" fill="url(#bg)" stroke="none"/><rect x="36" y="34" width="76" height="36" rx="9" fill="#172f4d" stroke="none"/><text x="74" y="60" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">B21</text><text x="132" y="62" font-size="34" fill="#172f4d" font-weight="700" text-anchor="start">Bằng chứng cho một hạt nhân nhỏ</text><text x="40" y="103" font-size="19" fill="#506980" font-weight="400" text-anchor="start">Từ đường đi của hạt α đến cách đọc A, Z, N</text><rect x="35" y="140" width="675" height="460" rx="18" fill="#fff" stroke="none"/><rect x="730" y="140" width="435" height="460" rx="18" fill="#fff" stroke="none"/><rect x="361" y="198" width="16" height="280" rx="3" fill="#e9b659" stroke="none"/><text x="369" y="183" font-size="19" fill="#506980" font-weight="400" text-anchor="middle">Lá vàng mỏng</text><path d="M 75 245 L 645 245" stroke="#147e7b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 75 305 L 645 305" stroke="#147e7b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 75 385 L 645 385" stroke="#147e7b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 75 455 L 645 455" stroke="#147e7b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 75 342 L 349 342 Q 405 340 480 215 L 605 192" stroke="#d54f53" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 75 360 L 338 360 Q 401 360 285 418 L 184 466" stroke="#d54f53" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="368" cy="350" r="12" fill="#e5ac3e" opacity="1"/><text x="368" y="357" font-size="19" fill="#172f4d" font-weight="700" text-anchor="middle">+</text><circle cx="89" cy="342" r="10" fill="#d54f53" opacity="1"/><text x="85" y="325" font-size="24" fill="#d54f53" font-weight="700" text-anchor="start">α</text><text x="60" y="530" font-size="20" fill="#506980" font-weight="400" text-anchor="start">Phần lớn α đi gần như thẳng.</text><text x="60" y="558" font-size="20" fill="#506980" font-weight="400" text-anchor="start">Một số rất ít bị lệch mạnh hoặc bật ngược.</text><circle cx="959.37" cy="325.0" r="9" fill="#d54f53" opacity="1"/><circle cx="917.54" cy="346.49" r="9" fill="#d54f53" opacity="1"/><circle cx="944.59" cy="284.08" r="9" fill="#d54f53" opacity="1"/><circle cx="970.57" cy="363.57" r="9" fill="#d54f53" opacity="1"/><circle cx="886.73" cy="315.4" r="9" fill="#d54f53" opacity="1"/><circle cx="992.41" cy="292.3" r="9" fill="#d54f53" opacity="1"/><circle cx="923.8" cy="388.97" r="9" fill="#268fbc" opacity="1"/><circle cx="908.21" cy="261.86" r="9" fill="#268fbc" opacity="1"/><circle cx="1012.15" cy="350.98" r="9" fill="#268fbc" opacity="1"/><circle cx="866.98" cy="355.55" r="9" fill="#268fbc" opacity="1"/><circle cx="976.68" cy="248.75" r="9" fill="#268fbc" opacity="1"/><circle cx="967.37" cy="409.07" r="9" fill="#268fbc" opacity="1"/><text x="941" y="466" font-size="36" fill="#172f4d" font-weight="700" text-anchor="middle">C-12</text><text x="770" y="515" font-size="20" fill="#506980" font-weight="400" text-anchor="start">Z = 6 proton     N = 6 neutron</text><text x="770" y="543" font-size="20" fill="#506980" font-weight="400" text-anchor="start">A = Z + N = 12</text><text x="770" y="571" font-size="20" fill="#506980" font-weight="400" text-anchor="start">C-14: cùng Z = 6, nhưng N = 8.</text><circle cx="795" cy="193" r="7" fill="#d54f53" opacity="1"/><text x="814" y="200" font-size="17" fill="#172f4d" font-weight="400" text-anchor="start">Proton (+)</text><circle cx="987" cy="193" r="7" fill="#268fbc" opacity="1"/><text x="1006" y="200" font-size="17" fill="#172f4d" font-weight="400" text-anchor="start">Neutron</text><text x="40" y="670" font-size="16" fill="#506980" font-weight="400" text-anchor="start">Sơ đồ định tính, hạt nhân phóng đại; không thể suy ra tỉ lệ kích thước từ hình.</text><g class="motion-guide"><circle r="8" fill="#d54f53"><animateMotion dur="5s" repeatCount="indefinite" path="M 75 342 L 349 342 Q 405 340 480 215 L 605 192"/></circle><circle r="7" fill="#147e7b"><animateMotion dur="5s" repeatCount="indefinite" path="M 75 245 L 645 245"/></circle></g></g></svg>