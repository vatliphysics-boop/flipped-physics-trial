<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Ba loại bức xạ, ba cách đọc hình</title><desc id="desc">So sánh bản chất và sự suy giảm qua vật liệu chắn Mức đâm xuyên phụ thuộc năng lượng và vật liệu; tia γ suy giảm, không bị chặn tuyệt đối như nét vẽ.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f6fb"/><stop offset="1" stop-color="#e4eef7"/></linearGradient></defs><style>@media(prefers-reduced-motion:reduce){.motion-guide{display:none}}</style><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="700" rx="24" fill="url(#bg)" stroke="none"/><rect x="36" y="34" width="76" height="36" rx="9" fill="#172f4d" stroke="none"/><text x="74" y="60" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">B23</text><text x="132" y="62" font-size="34" fill="#172f4d" font-weight="700" text-anchor="start">Ba loại bức xạ, ba cách đọc hình</text><text x="40" y="103" font-size="19" fill="#506980" font-weight="400" text-anchor="start">So sánh bản chất và sự suy giảm qua vật liệu chắn</text><rect x="35" y="140" width="1130" height="455" rx="18" fill="#fff" stroke="none"/><rect x="354" y="217" width="20" height="314" rx="4" fill="#e9d6ae" stroke="none"/><text x="364.0" y="186" font-size="23" fill="#172f4d" font-weight="700" text-anchor="middle">Giấy</text><rect x="623" y="217" width="36" height="314" rx="4" fill="#aebdca" stroke="none"/><text x="641.0" y="186" font-size="23" fill="#172f4d" font-weight="700" text-anchor="middle">Nhôm</text><rect x="882" y="217" width="102" height="314" rx="4" fill="#657f95" stroke="none"/><text x="933.0" y="186" font-size="23" fill="#172f4d" font-weight="700" text-anchor="middle">Chì / bê tông</text><circle cx="129" cy="275" r="36" fill="#d54f53" opacity="1"/><text x="129" y="285" font-size="31" fill="#fff" font-weight="700" text-anchor="middle">α</text><circle cx="129" cy="380" r="36" fill="#268fbc" opacity="1"/><text x="129" y="390" font-size="31" fill="#fff" font-weight="700" text-anchor="middle">β</text><circle cx="129" cy="485" r="36" fill="#8a55b5" opacity="1"/><text x="129" y="495" font-size="31" fill="#fff" font-weight="700" text-anchor="middle">γ</text><path d="M 185 275 L 340 275" stroke="#d54f53" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="355" cy="275" r="8" fill="#d54f53" opacity="1"/><path d="M 185 380 L 608 380" stroke="#268fbc" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="630" cy="380" r="7" fill="#268fbc" opacity="1"/><path d="M 185 485 L 874 485" stroke="#8a55b5" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 982 485 L 1092 485" stroke="#bea5d2" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="8 8"/><text x="70" y="567" font-size="20" fill="#506980" font-weight="400" text-anchor="start">α: hạt nhân He-4        β: electron / positron        γ: photon năng lượng cao</text><text x="60" y="627" font-size="22" fill="#172f4d" font-weight="700" text-anchor="start">Phân rã: tự phát · ngẫu nhiên với từng hạt · có quy luật thống kê với nhiều hạt</text><text x="40" y="670" font-size="16" fill="#506980" font-weight="400" text-anchor="start">Mức đâm xuyên phụ thuộc năng lượng và vật liệu; tia γ suy giảm, không bị chặn tuyệt đối như nét vẽ.</text><g class="motion-guide"><circle r="8" fill="#d54f53"><animateMotion path="M 185 275 L 345 275" dur="4s" repeatCount="indefinite"/></circle><circle r="7" fill="#268fbc"><animateMotion path="M 185 380 L 620 380" dur="4s" repeatCount="indefinite"/></circle><circle r="6" fill="#8a55b5"><animateMotion path="M 185 485 L 1092 485" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0.25;0.25" keyTimes="0;0.75;0.9;1" dur="4s" repeatCount="indefinite"/></circle></g></g></svg>